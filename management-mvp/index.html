</style></head><body><header><div><strong>DIVA STUDIO</strong><small>Project Sashakt · Livelihood management</small></div><button id="logout" hidden>Sign out</button></header><main><div id="message" role="status"></div><div id="root"></div></main><footer>Elixir Foundation · Project Sashakt</footer><script>
const root=document.querySelector('#root'),msg=document.querySelector('#message'),logout=document.querySelector('#logout');
let user=null,data={},page='Dashboard',reportState=null,reportSequence=0,managerMonth='',managerBatch='',managerSeq=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const labels={'Dashboard':'Overview','Attendance':'Attendance','Production':'Daily work','Verification':'Income check','Expenses':'Expenses','Payments':'Payments','Master data':'Beneficiaries & setup','Accounts':'Accounts','Review':'Resolve differences','My income':'My income','Submit income':'Add income','Settings':'Settings','Owner performance':'Performance','Studios':'Studios','Managers':'Studio managers','Form settings':'Form settings','Reports':'Diva Data export','Tasks':'Pending work'};
const statusName=s=>({present:'Present',absent:'Absent',half_day:'Half day',leave:'Leave',home_based:'Home-based work',matched:'Matched',mismatch:'Difference',beneficiary_pending:'Awaiting beneficiary',manager_pending:'Awaiting manager'}[s]||s);
const fmtDate=v=>String(v??'').slice(0,10);
const roleName=r=>({owner:'Website owner',admin:'Admin',manager:'Studio manager',beneficiary:'Beneficiary'}[r]||r);
const opts=(arr,field='name')=>arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x[field])+'</option>').join('');
const field=(n,l,type='text',val='')=>'<label>'+esc(l)+'</label><input name="'+n+'" type="'+type+'" value="'+esc(val)+'" required>';
const select=(n,l,o)=>'<label>'+esc(l)+'</label><select name="'+n+'" required><option value="">Select</option>'+o+'</select>';
const studio=()=>['owner','admin'].includes(user.role)?select('studio_id','Studio',opts(data.studios.filter(x=>x.active))):'';
const customForm=(key)=>{const cfg=data.forms?.[key]||{};return (cfg.instruction?'<p class="help">'+esc(cfg.instruction)+'</p>':'')+(cfg.custom_label?'<label>'+esc(cfg.custom_label)+(cfg.custom_required?'':' (optional)')+'</label><input name="custom_value" maxlength="1000" '+(cfg.custom_required?'required':'')+'>':'')};
const card=(title,html)=>'<section class="card">'+(title?'<h2>'+esc(title)+'</h2>':'')+html+'</section>';
const fields=(...parts)=>'<div class="formgrid">'+parts.map(x=>'<div>'+x+'</div>').join('')+'</div>';
const moneyText=v=>v==null||v===''?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyKeys=['manager_income','beneficiary_income','verified_income','income','outside_income'];
const statusCell=v=>'<span class="statuschip '+(v==='mismatch'?'bad':String(v).includes('pending')?'wait':'')+'">'+esc(statusName(v))+'</span>';
const form=(action,html)=>'<form data-action="'+action+'">'+html+'<button type="submit">'+({login:'Sign in',attendance:'Save attendance',production:'Save daily work',self_income:'Submit income',create_user:'Create account',change_password:'Change password',review:'Save decision',expense:'Save expense',payment:'Save payment',owner_studio:'Add studio',owner_manager:'Save manager',owner_form:'Save form settings',assign_work:'Save work assignment'}[action]||'Save')+'</button></form>';
const table=(arr,cols)=>!arr?.length?'<div class="empty">No records yet.</div>':'<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(x=>'<td class="'+(moneyKeys.includes(x[0])?'tablemoney':'')+'">'+(x[0]==='status'?statusCell(r[x[0]]):esc(moneyKeys.includes(x[0])?moneyText(r[x[0]]):x[0]==='work_date'?fmtDate(r[x[0]]):r[x[0]]??'—'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function api(action,b={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...b})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
function showLogin(){user=null;logout.hidden=true;root.innerHTML='<section class="card login"><h1>Welcome to Diva</h1><p class="muted">Sign in with your assigned account.</p>'+form('login',field('username','Username')+field('password','Password','password'))+'</section>';}
async function load(){data=await api('data');render()}
function bindManagerDashboard(){
const month=root.querySelector('#managerMonth'),batch=root.querySelector('#managerBatch'),out=root.querySelector('#managerMetrics');
const rupee=v=>'₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});
const run=async()=>{const seq=++managerSeq;try{managerMonth=month.value;managerBatch=batch.value;out.innerHTML='<div class="card empty">Loading…</div>';const r=await api('manager_dashboard',{month:managerMonth+'-01',batch:managerBatch});if(seq!==managerSeq||!out.isConnected)return;const people=r.roster||[],earned=people.filter(x=>Number(x.completed_records)>0),earners=earned.filter(x=>Number(x.income)>0),total=earned.reduce((s,x)=>s+Number(x.income),0),targets=earned.filter(x=>x.target!=null&&Number(x.target)>0),low=targets.filter(x=>Number(x.income)<Number(x.target)),avg=earned.length?total/earned.length:0,below=earned.filter(x=>Number(x.income)<avg),pending=r.tasks||{};
const metrics=[['Beneficiaries earning',earners.length+' / '+people.length,people.length?(targets.length?low.length+' below monthly target':earned.length?below.length+' below batch average':'No completed earnings yet'):'Roster not registered'],['Pending work',Number(pending.pending_tasks||0),Number(pending.pending_pieces||0)+' pieces remaining'],['Batch earnings',earned.length?rupee(total):'—',earned.length?'Average '+rupee(avg)+' per beneficiary with records':'No completed income records']];
out.innerHTML='<div class="grid kpis manager-kpis">'+metrics.map(x=>card(x[0],'<div class="kpi">'+esc(x[1])+'</div><p class="kpi-note">'+esc(x[2])+'</p>')).join('')+'</div><div class="quick"><button data-page="Attendance">Attendance</button><button data-page="Tasks">Pending work</button><button data-page="Production">+ Assign work</button></div>'+card('Beneficiary earnings',table(people.map(x=>({name:x.name,batch:x.batch||'Unassigned',income:Number(x.completed_records)?x.income:null,state:Number(x.completed_records)?(Number(x.income)>0?'Earning':'Recorded zero'):'No completed records'})),[['name','Beneficiary'],['batch','Batch'],['income','Income ₹'],['state','Status']]))+(people.length?'':'<div class="manager-empty">Your studio has no active roster. Contact the owner or admin to register the current batch.</div>');}catch(e){if(seq===managerSeq&&out.isConnected)out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}};
month.onchange=run;batch.onchange=run;run();
}
function bindManagerTasks(){const out=root.querySelector('#managerTasks');const loadTasks=async()=>{try{const r=await api('manager_tasks');if(!out.isConnected)return;const pending=r.tasks.filter(x=>!x.completed_date),done=r.tasks.filter(x=>x.completed_date);const row=t=>'<div class="task-row"><div><strong>'+esc(t.name)+'</strong><p>'+esc(t.vendor)+' · '+esc(t.product)+' · '+esc(t.pieces)+' pieces</p><p>'+esc(t.received_date)+' · ₹'+esc((Number(t.pieces)*Number(t.rate)).toLocaleString('en-IN',{maximumFractionDigits:2}))+(t.completed_date?' · Completed '+esc(t.completed_date):' expected')+'</p></div>'+(t.completed_date?'<span class="statuschip">Completed</span>':'<button type="button" data-complete="'+esc(t.id)+'">Complete</button>')+'</div>';out.innerHTML='<div class="totalbar">'+pending.length+' pending assignments · '+pending.reduce((s,t)=>s+Number(t.pieces),0)+' pieces</div>'+(pending.length?pending.map(row).join(''):'<div class="empty">No pending work.</div>')+(done.length?'<details><summary>Recently completed ('+done.length+')</summary>'+done.map(row).join('')+'</details>':'');out.querySelectorAll('[data-complete]').forEach(btn=>btn.onclick=async()=>{if(!confirm('Mark this beneficiary’s assigned pieces completed today? This records her earned income.'))return;btn.disabled=true;try{await api('complete_work',{id:btn.dataset.complete,work_date:today()});await loadTasks();msg.dataset.kind='success';msg.textContent='Work completed and income recorded.'}catch(e){msg.dataset.kind='error';msg.textContent=e.message;btn.disabled=false}})}catch(e){if(out.isConnected)out.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}};loadTasks()}
function bindOwnerReport(){
const el=id=>root.querySelector('#'+id),out=el('ownerReport'),year=el('rYear'),start=el('rStart'),end=el('rEnd'),studio=el('rStudio'),batch=el('rBatch');
const read=()=>({year:year.value,start:start.value,end:end.value,studio_id:studio.value,batch:batch.value});
const check=()=>{const s=read();if(!s.start||!s.end||s.start>s.end||Date.parse(s.end)-Date.parse(s.start)>366*86400000)throw Error('Choose a valid period of up to one year.');return s};
const sum=(arr,key)=>arr.reduce((n,r)=>n+Number(r[key]||0),0);
const has=(arr,key)=>arr.some(r=>r[key]!=null);
const money=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const chart=(rows,key,title)=>{const groups=new Map();for(const row of rows)groups.set(row.month,(groups.get(row.month)||0)+Number(row[key]||0));const list=[...groups.entries()].sort();const max=Math.max(1,...list.map(x=>Math.abs(x[1])));return card(title,list.length?'<div class="reportchart">'+list.map(([month,value])=>'<div class="chartrow"><span>'+esc(month.slice(0,7))+'</span><div class="charttrack"><div class="chartfill '+(key==='income'?'legacy':'')+'" style="width:'+Math.max(0,Math.min(100,Math.abs(value)/max*100))+'%"></div></div><strong>'+esc(money(value))+'</strong></div>').join('')+'</div>':'<div class="empty">No records for selected filters.</div>')};
const show=r=>{const l=r.live||[],old=(r.legacy||[]).filter(x=>x.source_status==='matched'),flag=(r.legacy||[]).filter(x=>x.source_status!=='matched'),ver=r.verification||[],att=r.attendance||[];
const k=[['Historical income (source-matched)',old.length?money(sum(old,'income')):'—'],['Live manager income',l.length?money(sum(l,'income')):'—'],['Verified live income',has(ver,'verified_income')?money(sum(ver,'verified_income')):'—'],['Live completed pieces',l.length?sum(l,'pieces').toLocaleString('en-IN'):'—']];
const names=[...new Set([...l,...old,...flag,...ver,...att].map(x=>x.studio))].sort();
const stats=names.map(st=>{const o=old.filter(x=>x.studio===st),n=l.filter(x=>x.studio===st),v=ver.filter(x=>x.studio===st),a=att.filter(x=>x.studio===st);return {studio:st,legacy:o.length?money(sum(o,'income')):'—',live:n.length?money(sum(n,'income')):'—',verified:has(v,'verified_income')?money(sum(v,'verified_income')):'—',pieces:n.length?sum(n,'pieces'):'—',present:a.length?sum(a,'present'):'—',marked:a.length?sum(a,'marked'):'—',differences:v.length?sum(v,'differences'):'—'}});
out.innerHTML='<div class="grid kpis owner-kpis">'+k.map(([label,value])=>card(label,'<div class="kpi">'+esc(value)+'</div>')).join('')+'</div>'+card('Studio comparison',table(stats,[['studio','Studio'],['legacy','Historical ₹'],['live','Manager ₹'],['verified','Verified ₹'],['pieces','Pieces'],['present','Present marks'],['marked','Total marks'],['differences','Differences']]))+(page==='Owner performance'?chart(old,'income','Historical monthly income')+chart(l,'income','Live monthly manager income'):'')+card('Data quality','<p class="reportnote">'+new Set(flag.map(x=>x.studio+'|'+x.beneficiary_key)).size+' flagged historical source rows in this selection; excluded from historical KPI, included separately in Excel. '+sum(ver,'pending')+' live pending checks; '+sum(ver,'differences')+' unresolved differences. Batch filters on attendance and verification use current beneficiary batch; production uses saved batch.</p>');};

root.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,a=f.dataset.action,b=Object.fromEntries(new FormData(f));msg.textContent='';msg.dataset.kind='';const btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{if(a==='change_password'&&b.password!==b.confirm_password)throw Error('New passwords do not match.');if(a==='change_password'&&b.password.length<12)throw Error('Use at least 12 characters.');if(a==='attendance')b.entries=[...f.querySelectorAll('[data-attendance]')].filter(x=>x.value&&String(x.closest('[data-studio]').dataset.studio)===String(b.studio_id||user.studio_id)&&(user.role!=='manager'||!x.closest('.attrow').hidden)).map(x=>({beneficiary_id:x.dataset.attendance,status:x.value}));if(a==='production'||a==='assign_work')b.allocations=[...f.querySelectorAll('.alloc')].filter(x=>x.querySelector('.bid').value).map(x=>({beneficiary_id:x.querySelector('.bid').value,pieces:x.querySelector('.qty').value,rate:x.querySelector('.rate').value}));if(a==='attendance'&&!b.entries.length)throw Error('Select a studio and mark at least one beneficiary.');if(a==='attendance'&&user.role==='manager'){const rows=[...f.querySelectorAll('.attrow')].filter(x=>!x.hidden);if(rows.some(x=>!x.querySelector('[data-attendance]').value))throw Error('Mark every beneficiary in the selected batch before submitting.');}if(a==='production'||a==='assign_work'){const rows=[...f.querySelectorAll('.alloc')];if(rows.some(x=>!x.querySelector('.bid').value&&(x.querySelector('.qty').value!==''||x.querySelector('.rate').value!=='')))throw Error('Select a beneficiary for each allocation.');if(b.allocations.some(x=>x.pieces===''||x.rate===''))throw Error('Enter pieces and rate for each selected beneficiary.');if(new Set(b.allocations.map(x=>x.beneficiary_id)).size!==b.allocations.length)throw Error('Choose each beneficiary only once.');if(b.allocations.reduce((s,x)=>s+Number(x.pieces),0)!==Number(a==='assign_work'?b.provided:b.completed))throw Error(a==='assign_work'?'Assigned pieces must equal pieces received.':'Allocated pieces must equal completed pieces.');}const r=await api(a,b);if(a==='login'){user=r.user;page=user.role==='beneficiary'?'Submit income':user.role==='owner'?'Owner performance':'Dashboard';user.must_change_password?render():await load()}else if(a==='change_password'){showLogin();msg.textContent='Password changed. Sign in again.'}else{if(a==='assign_work')page='Tasks';await load();msg.dataset.kind='success';msg.textContent=a==='assign_work'?'Work assigned. Mark it completed when finished.':'Saved successfully.'}}catch(err){msg.dataset.kind='error';msg.textContent=err.message}finally{if(btn)btn.disabled=false}});
logout.onclick=async()=>{try{await api('logout')}finally{data={};reportState=null;reportSequence++;managerMonth='';managerBatch='';managerSeq++;page='Dashboard';msg.textContent='';showLogin()}};
(async()=>{try{user=(await api('me')).user;user.must_change_password?render():await load()}catch{showLogin();try{const r=await fetch('/api?health=1');const h=await r.json();if(h.database!=='connected')msg.textContent='Database is unavailable. Try again or contact your administrator.'}catch{msg.textContent='Backend unavailable.'}}})();
