on{padding:6px;margin:0}input,select,button{min-width:0;min-height:40px}button:disabled{opacity:.5;cursor:not-allowed}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #9ac5ab;outline-offset:2px}#message:empty{display:none}#message:not(:empty){padding:10px 12px;border:1px solid #dce5df;border-radius:8px;background:white;margin-bottom:12px;font-size:13px}.login{max-width:390px;margin:clamp(12px,6vh,55px) auto;padding:22px}footer{font-size:11px;padding:12px}details{border:1px solid #dce5df;border-radius:10px;padding:12px;margin:10px 0;background:white}summary{font-weight:650;cursor:pointer}details .card{border:0;padding:8px 0 0;margin:0}td,th{font-size:13px;padding:8px}th{font-size:11px;background:#f4f7f4}@media(max-width:760px){main{padding:12px}.layout{display:block}.sidebar{position:static;margin-bottom:14px}.navgroup{flex-direction:row;overflow:auto;white-space:nowrap}.navgroup button{width:auto;flex:none;font-size:12px;min-height:36px}.navlabel,.profile,.secondarynav{display:none}.mobile-more{display:block;font-size:13px;margin-top:6px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.login{padding:20px}.alloc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}.alloc .bid{grid-column:1/-1}h1{font-size:22px}.kpi{font-size:23px}}

</style></head><body><header><div><strong>DIVA STUDIO</strong><small>Project Sashakt · Livelihood management</small></div><button id="logout" hidden>Sign out</button></header><main><div id="message" role="status"></div><div id="root"></div></main><footer>Elixir Foundation · Project Sashakt</footer><script>
const root=document.querySelector('#root'),msg=document.querySelector('#message'),logout=document.querySelector('#logout');
let user=null,data={},page='Dashboard';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const labels={'Dashboard':'Overview','Attendance':'Attendance','Production':'Daily work','Verification':'Income check','Expenses':'Expenses','Payments':'Payments','Master data':'Beneficiaries & setup','Accounts':'Accounts','Review':'Resolve differences','My income':'My income','Submit income':'Add income','Settings':'Settings'};
const statusName=s=>({present:'Present',absent:'Absent',half_day:'Half day',leave:'Leave',home_based:'Home-based work',matched:'Matched',mismatch:'Difference',beneficiary_pending:'Awaiting beneficiary',manager_pending:'Awaiting manager'}[s]||s);
const fmtDate=v=>String(v??'').slice(0,10);
const roleName=r=>({owner:'Website owner',admin:'Admin',manager:'Studio manager',beneficiary:'Beneficiary'}[r]||r);
const opts=(arr,field='name')=>arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x[field])+'</option>').join('');
const field=(n,l,type='text',val='')=>'<label>'+esc(l)+'</label><input name="'+n+'" type="'+type+'" value="'+esc(val)+'" required>';
const select=(n,l,o)=>'<label>'+esc(l)+'</label><select name="'+n+'" required><option value="">Select</option>'+o+'</select>';
const studio=()=>['owner','admin'].includes(user.role)?select('studio_id','Studio',opts(data.studios.filter(x=>x.active))):'';
const card=(title,html)=>'<section class="card">'+(title?'<h2>'+esc(title)+'</h2>':'')+html+'</section>';
const fields=(...parts)=>'<div class="formgrid">'+parts.map(x=>'<div>'+x+'</div>').join('')+'</div>';
const moneyText=v=>v==null||v===''?'—':Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyKeys=['manager_income','beneficiary_income','verified_income','income','outside_income'];
const statusCell=v=>'<span class="statuschip '+(v==='mismatch'?'bad':String(v).includes('pending')?'wait':'')+'">'+esc(statusName(v))+'</span>';
const form=(action,html)=>'<form data-action="'+action+'">'+html+'<button type="submit">'+({login:'Sign in',attendance:'Save attendance',production:'Save daily work',self_income:'Submit income',create_user:'Create account',change_password:'Change password',review:'Save decision',expense:'Save expense',payment:'Save payment'}[action]||'Save')+'</button></form>';
const table=(arr,cols)=>!arr?.length?'<div class="empty">No records yet.</div>':'<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(x=>'<td class="'+(moneyKeys.includes(x[0])?'tablemoney':'')+'">'+(x[0]==='status'?statusCell(r[x[0]]):esc(moneyKeys.includes(x[0])?moneyText(r[x[0]]):x[0]==='work_date'?fmtDate(r[x[0]]):r[x[0]]??'—'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function api(action,b={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...b})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
function showLogin(){user=null;logout.hidden=true;root.innerHTML='<section class="card login"><h1>Welcome to Diva</h1><p class="muted">Sign in with your assigned account.</p>'+form('login',field('username','Username')+field('password','Password','password'))+'</section>';}
async function load(){data=await api('data');render()}
function render(){logout.hidden=false;if(user.must_change_password){root.innerHTML='<div class="login card"><h1>Set your password</h1><p class="muted">Choose a new password before continuing.</p>'+form('change_password',field('current_password','Temporary password','password')+field('password','New password (12+ characters)','password')+field('confirm_password','Confirm new password','password'))+'</div>';return;}
const a=['owner','admin'].includes(user.role),benef=user.role==='beneficiary';
const primary=benef?['Submit income','My income']:['Dashboard','Attendance','Production','Verification'];
const secondary=benef?['Settings']:['Payments','Expenses',...(a?['Review','Master data','Accounts']:[]),'Settings'];
const pages=[...primary,...secondary];if(!pages.includes(page))page=pages[0];
const nav=p=>'<button type="button" class="'+(p===page?'active':'')+'" data-page="'+p+'">'+esc(labels[p])+'</button>';
const location=benef?(data.profile?.name||''):a?'All studios':(data.studios||[]).find(s=>String(s.id)===String(user.studio_id))?.name||'Assigned studio';
let html='<div class="layout"><aside class="sidebar"><div class="navlabel">DAILY WORK</div><div class="navgroup">'+primary.map(nav).join('')+'</div><div class="navlabel">MORE</div><div class="navgroup secondarynav">'+secondary.map(nav).join('')+'</div><select class="mobile-more" id="moreNav" aria-label="More options"><option value="">More options</option>'+secondary.map(p=>'<option value="'+p+'" '+(p===page?'selected':'')+'>'+esc(labels[p])+'</option>').join('')+'</select><div class="profile"><strong>'+esc(user.username)+'</strong>'+esc(roleName(user.role))+'</div></aside><section class="workspace"><p class="muted">'+esc(location)+' · '+esc(roleName(user.role))+'</p><h1>'+esc(labels[page])+'</h1>';
const ben=(data.beneficiaries||[]).filter(b=>b.active),bl=opts(ben.map(b=>({...b,name:b.name+' · '+b.code})));
if(page==='Dashboard'){const ver=data.verification||[],prod=data.production||[];html+='<div class="grid kpis">'+[['Active beneficiaries',ben.length],['Recent pieces (last 100 jobs)',prod.reduce((s,p)=>s+Number(p.pieces_completed),0)],['Matched recent entries',ver.filter(x=>x.status==='matched').length],['Recent mismatches',ver.filter(x=>x.status==='mismatch').length]].map(x=>card(x[0],'<div class="kpi">'+x[1]+'</div>')).join('')+'</div><div class="quick"><button data-page="Attendance">Mark attendance</button><button data-page="Production">Add daily work</button><button class="secondary" data-page="Verification">Check income</button></div>'+card('Recent production',table(prod.slice(0,8),[['work_date','Date'],['vendor','Vendor'],['product','Product'],['pieces_completed','Completed']]))}
if(page==='Attendance'){html+=card('Daily attendance',form('attendance',studio()+field('work_date','Work date','date',today())+'<button type="button" class="secondary" id="markall">Mark all present</button><div class="totalbar" id="attendanceCount"></div><label for="attSearch">Find beneficiary</label><input id="attSearch" type="search" placeholder="Search name or code"><div id="attendance">'+ben.map(b=>'<div class="attrow" data-studio="'+esc(b.studio_id)+'" data-search="'+esc((b.name+' '+b.code).toLowerCase())+'"><label>'+esc(b.name)+'<small>'+esc(b.code)+'</small></label><select aria-label="Attendance for '+esc(b.name)+'" data-attendance="'+esc(b.id)+'"><option value="">Not marked</option>'+['present','absent','half_day','leave','home_based'].map(s=>'<option value="'+s+'">'+statusName(s)+'</option>').join('')+'</select></div>').join('')+'</div>'))}
if(page==='Production'){html+=card('Daily production',form('production',studio()+field('work_date','Work date','date',today())+select('vendor_id','Vendor',opts(data.vendors))+select('product_id','Product',opts(data.products))+'<div class="grid">'+field('provided','Pieces provided','number')+field('completed','Pieces completed','number')+field('rate','Vendor rate per piece (₹)','number')+'</div><h3>Who completed the work?</h3><p class="smallnote">Choose a beneficiary and enter her pieces and rate.</p><div id="allocations"></div><button type="button" class="secondary" id="addalloc">+ Add beneficiary</button><div class="totalbar" id="allocationTotal" aria-live="polite">Allocated: 0 pieces · Income: ₹0</div>'))}
if(page==='Verification'){html+=card('', '<div class="toolbar"><input id="verifySearch" type="search" aria-label="Find beneficiary" placeholder="Find beneficiary"><select id="verifyStatus" aria-label="Filter income status"><option value="">All statuses</option><option value="mismatch">Differences</option><option value="matched">Matched</option><option value="beneficiary_pending">Awaiting beneficiary</option><option value="manager_pending">Awaiting manager</option></select></div><p class="recordcount" id="verifyCount"></p><div id="verifyTable"></div>')}
if(page==='My income'){const rows=data.self||[];html+=card('', '<div class="smallstats"><span>'+rows.length+' recent entries</span></div>'+table(rows,[['work_date','Date'],['income','Diva income ₹'],['outside_income','Other income ₹']]))}
if(page==='Submit income'){html+=card('આજની આવક · Daily income','<div class="income-form">'+form('self_income',field('work_date','તારીખ / Date','date',today())+field('income','Diva income / દિવાથી આવક (₹)','number')+'<label>Other income / અન્ય આવક <span class="optional">(optional)</span></label><input name="outside_income" type="number" min="0" step=".01"><p class="help">Enter 0 if you did not earn today.</p>')+'</div>')}
if(page==='Expenses')html+=card('',form('expense',fields(studio()||'<p class="help">Assigned studio</p>',field('work_date','Date','date',today()))+fields(field('category','Expense category'),field('amount','Amount (₹)','number'))+'<label>Notes <span class="optional">(optional)</span></label><input name="notes">'));
if(page==='Payments')html+=card('',form('payment',studio()+select('beneficiary_id','Beneficiary',bl)+fields(field('work_date','Payment date','date',today()),field('amount','Amount paid (₹)','number'))+'<label>Payment reference <span class="optional">(optional)</span></label><input name="reference"><p class="help">Record only money actually paid.</p>'));
if(page==='Master data'){html+=card('Register beneficiary',form('master','<input type="hidden" name="kind" value="beneficiary">'+studio()+field('code','Unique code')+field('name','Registered name')+'<label>Batch</label><input name="batch"><label>Partner</label><input name="partner">'+select('category','Category','<option>regular</option><option>alumni</option>')))+'<details><summary>Registered beneficiaries ('+data.beneficiaries.length+')</summary>'+card('Beneficiary list',table(data.beneficiaries,[['code','Code'],['name','Name'],['batch','Batch'],['category','Category']]))+'</details>'+['vendor','product','studio'].map(k=>'<details><summary>Add '+k+'</summary>'+card('New '+k,form('master','<input type="hidden" name="kind" value="'+k+'">'+field('name','Name')))+'</details>').join('');}
if(page==='Accounts')html+=card('Create account',form('create_user',studio()+select('role','Role','<option>manager</option><option>beneficiary</option>'+(user.role==='owner'?'<option>admin</option>':''))+field('username','Username')+field('password','Temporary password','password')+'<label>Beneficiary (if applicable)</label><select name="beneficiary_id"><option value="">Not applicable</option>'+bl+'</select>'));
if(page==='Review')html+=card('',form('review',studio()+select('beneficiary_id','Beneficiary',bl)+fields(field('work_date','Work date','date',today()),field('amount','Approved income (₹)','number'))+field('reason','Reason for decision')+'<p class="help">Original manager and beneficiary entries remain unchanged.</p>'));
if(page==='Settings')html+=card('Change password',form('change_password',field('current_password','Current password','password')+field('password','New password (12+ characters)','password')+field('confirm_password','Confirm new password','password')));
html+='</section></div>';root.innerHTML=html;
root.querySelectorAll('input[type=number]').forEach(x=>{x.min='0';x.step=['provided','completed'].includes(x.name)?'1':'.01'});
const more=root.querySelector('#moreNav');if(more)more.onchange=()=>{if(more.value){page=more.value;msg.textContent='';render()}};
const st=root.querySelector('select[name=studio_id]');
if(page==='Verification'){const search=root.querySelector('#verifySearch'),status=root.querySelector('#verifyStatus');const refresh=()=>{const rows=(data.verification||[]).filter(x=>String(x.name||'').toLowerCase().includes(search.value.trim().toLowerCase())&&(!status.value||x.status===status.value));root.querySelector('#verifyCount').textContent=rows.length+' of '+(data.verification||[]).length+' recent records';root.querySelector('#verifyTable').innerHTML=table(rows,[['work_date','Date'],['name','Beneficiary'],['manager_income','Manager ₹'],['beneficiary_income','Beneficiary ₹'],['status','Status'],['verified_income','Matched ₹']])};search.oninput=refresh;status.onchange=refresh;refresh()}

const currentStudio=()=>String(st?.value||user.studio_id||'');
const scopedBen=()=>ben.filter(x=>String(x.studio_id)===currentStudio());
const benOptions=()=>opts(scopedBen().map(x=>({...x,name:x.name+' · '+x.code})));
const totals=()=>{const bar=root.querySelector('#allocationTotal');if(!bar)return;const rows=[...root.querySelectorAll('.alloc')];const pieces=rows.reduce((n,x)=>n+(Number(x.querySelector('.qty').value)||0),0),income=rows.reduce((n,x)=>n+(Number(x.querySelector('.qty').value)||0)*(Number(x.querySelector('.rate').value)||0),0);const completed=root.querySelector('[name=completed]')?.value;bar.textContent='Allocated: '+pieces+(completed!==''&&completed!=null?' / '+completed:'')+' pieces · Income: ₹'+income.toLocaleString('en-IN',{maximumFractionDigits:2});bar.classList.toggle('bad',completed!==''&&completed!=null&&pieces!==Number(completed))};
const add=()=>{const wrap=root.querySelector('#allocations');wrap.insertAdjacentHTML('beforeend','<div class="alloc"><select class="bid" aria-label="Beneficiary"><option value="">Select beneficiary</option>'+benOptions()+'</select><input class="qty" aria-label="Pieces" type="number" min="0" step="1" placeholder="Pieces"><input class="rate" aria-label="Income per piece" type="number" min="0" step=".01" placeholder="₹ / piece"><button type="button" class="secondary removealloc" aria-label="Remove beneficiary">×</button></div>');const row=wrap.lastElementChild;row.querySelector('.removealloc').onclick=()=>{row.remove();totals()};row.oninput=totals;totals()};
if(root.querySelector('#addalloc')){root.querySelector('#addalloc').onclick=add;root.querySelector('[name=completed]').oninput=totals;add()}
if(page==='Attendance'){
const day=root.querySelector('[name=work_date]'),search=root.querySelector('#attSearch'),rows=[...root.querySelectorAll('.attrow')];
const count=()=>{const sel=rows.filter(x=>x.dataset.studio===currentStudio()).map(x=>x.querySelector('select'));root.querySelector('#attendanceCount').textContent=sel.filter(x=>x.value).length+' / '+sel.length+' marked · '+sel.filter(x=>x.value==='present').length+' present'};
const filter=()=>{rows.forEach(x=>{x.hidden=x.dataset.studio!==currentStudio()||!x.dataset.search.includes(search.value.trim().toLowerCase())});count()};
const populate=()=>{rows.forEach(x=>{const sel=x.querySelector('select');sel.value=(data.attendance||[]).find(z=>String(z.beneficiary_id)===sel.dataset.attendance&&fmtDate(z.work_date)===day.value)?.status||''});filter()};
day.onchange=populate;search.oninput=filter;rows.forEach(x=>x.querySelector('select').onchange=count);
root.querySelector('#markall').onclick=()=>{rows.filter(x=>x.dataset.studio===currentStudio()).forEach(x=>x.querySelector('select').value='present');count()};if(st)st.onchange=populate;populate()
}else if(st){const refresh=()=>{root.querySelectorAll('.bid,select[name=beneficiary_id]').forEach(sel=>{const old=sel.value;sel.innerHTML='<option value="">Select beneficiary</option>'+benOptions();if(scopedBen().some(x=>String(x.id)===old))sel.value=old});totals()};st.onchange=refresh;refresh()}
if(page==='Accounts'){const role=root.querySelector('[name=role]'),bid=root.querySelector('[name=beneficiary_id]');const sync=()=>{const isAdmin=role.value==='admin',isBen=role.value==='beneficiary';if(st){st.required=!isAdmin;st.hidden=isAdmin;if(st.previousElementSibling)st.previousElementSibling.hidden=isAdmin}bid.required=isBen;bid.hidden=!isBen;if(bid.previousElementSibling)bid.previousElementSibling.hidden=!isBen};role.onchange=sync;sync()}

}
root.addEventListener('click',e=>{if(e.target.dataset.page){page=e.target.dataset.page;msg.textContent='';render()}});
root.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,a=f.dataset.action,b=Object.fromEntries(new FormData(f));msg.textContent='';msg.dataset.kind='';const btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{if(a==='change_password'&&b.password!==b.confirm_password)throw Error('New passwords do not match.');if(a==='change_password'&&b.password.length<12)throw Error('Use at least 12 characters.');if(a==='attendance')b.entries=[...f.querySelectorAll('[data-attendance]')].filter(x=>x.value&&String(x.closest('[data-studio]').dataset.studio)===String(b.studio_id||user.studio_id)).map(x=>({beneficiary_id:x.dataset.attendance,status:x.value}));if(a==='production')b.allocations=[...f.querySelectorAll('.alloc')].filter(x=>x.querySelector('.bid').value).map(x=>({beneficiary_id:x.querySelector('.bid').value,pieces:x.querySelector('.qty').value,rate:x.querySelector('.rate').value}));if(a==='attendance'&&!b.entries.length)throw Error('Select a studio and mark at least one beneficiary.');if(a==='production'){const rows=[...f.querySelectorAll('.alloc')];if(rows.some(x=>!x.querySelector('.bid').value&&(x.querySelector('.qty').value!==''||x.querySelector('.rate').value!=='')))throw Error('Select a beneficiary for each allocation.');if(b.allocations.some(x=>x.pieces===''||x.rate===''))throw Error('Enter pieces and rate for each selected beneficiary.');if(new Set(b.allocations.map(x=>x.beneficiary_id)).size!==b.allocations.length)throw Error('Choose each beneficiary only once.');if(b.allocations.reduce((s,x)=>s+Number(x.pieces),0)!==Number(b.completed))throw Error('Allocated pieces must equal completed pieces.');}const r=await api(a,b);if(a==='login'){user=r.user;page=user.role==='beneficiary'?'Submit income':'Dashboard';user.must_change_password?render():await load()}else if(a==='change_password'){showLogin();msg.textContent='Password changed. Sign in again.'}else{await load();msg.dataset.kind='success';msg.textContent='Saved successfully.'}}catch(err){msg.dataset.kind='error';msg.textContent=err.message}finally{if(btn)btn.disabled=false}});
logout.onclick=async()=>{try{await api('logout')}finally{data={};page='Dashboard';msg.textContent='';showLogin()}};
(async()=>{try{user=(await api('me')).user;user.must_change_password?render():await load()}catch{showLogin();try{const r=await fetch('/api?health=1');const h=await r.json();if(h.database!=='connected')msg.textContent='Database is unavailable. Try again or contact your administrator.'}catch{msg.textContent='Backend unavailable.'}}})();
