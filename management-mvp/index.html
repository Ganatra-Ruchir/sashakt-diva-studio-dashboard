<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diva Studio | Sashakt</title><style>
:root{font:15px/1.5 system-ui,sans-serif;color:#253a35;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}header{padding:18px 6%;display:flex;align-items:center;justify-content:space-between;background:#193d35;color:white}header strong{font-size:20px;letter-spacing:.08em}header small{display:block;color:#c8ded4}main{max-width:1180px;padding:28px 20px;margin:auto}.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #163b3510}h1,h2,h3{line-height:1.2;margin:0 0 14px}h1{font-size:27px}h2{font-size:19px}.muted{color:#667b70}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #cbd9d1;max-width:100%;width:100%}button{background:#216b50;color:white;border:0;font-weight:650;cursor:pointer;margin-top:12px}button.secondary{background:#e7efe9;color:#234a38}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}nav button{width:auto;margin:0}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #e7ede8;white-space:nowrap}th{font-size:12px;color:#667b70}.scroll{overflow:auto}.kpi{font-size:30px;font-weight:700}.notice{padding:12px;border-radius:8px;background:#fff4d8;color:#684b18;margin:12px 0}.ok{color:#216b50}.bad{color:#a44b41}.login{max-width:420px;margin:25px auto}.alloc{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:8px 0}#message{min-height:24px;color:#a44b41}header button{width:auto;margin:0}footer{text-align:center;color:#667b70;padding:18px}
</style></head><body><header><div><strong>DIVA STUDIO</strong><small>Project Sashakt · Livelihood management</small></div><button id="logout" hidden>Sign out</button></header><main><div id="message" role="status"></div><div id="root"></div></main><footer>Elixir Foundation · Restricted access · MVP</footer><script>
const root=document.querySelector('#root'),msg=document.querySelector('#message'),logout=document.querySelector('#logout');
let user=null,data={},page='Dashboard';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const opts=(arr,field='name')=>arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x[field])+'</option>').join('');
const field=(n,l,type='text',val='')=>'<label>'+esc(l)+'</label><input name="'+n+'" type="'+type+'" value="'+esc(val)+'" required>';
const select=(n,l,o)=>'<label>'+esc(l)+'</label><select name="'+n+'" required><option value="">Select</option>'+o+'</select>';
const studio=()=>['owner','admin'].includes(user.role)?select('studio_id','Studio',opts(data.studios.filter(x=>x.active))):'';
const card=(title,html)=>'<section class="card"><h2>'+title+'</h2>'+html+'</section>';
const form=(action,html)=>'<form data-action="'+action+'">'+html+'<button>'+(action==='login'?'Sign in':'Save')+'</button></form>';
const table=(arr,cols)=>'<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(r[x[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function api(action,b={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...b})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
function showLogin(){user=null;logout.hidden=true;root.innerHTML='<section class="card login"><h1>Welcome to Diva</h1><p class="muted">Sign in with your assigned account.</p>'+form('login',field('username','Username')+field('password','Password','password'))+'<p class="muted">Owner · Admin · Studio manager · Beneficiary</p></section>';}
async function load(){data=await api('data');render()}
function render(){logout.hidden=false;if(user.must_change_password){root.innerHTML=card('Set your new password',form('change_password',field('current_password','Temporary password','password')+field('password','New password (12+ characters)','password')));return;}
const a=['owner','admin'].includes(user.role),benef=user.role==='beneficiary';const pages=benef?['My income','Submit income']:['Dashboard','Attendance','Production','Verification','Expenses','Payments',...(a?['Master data','Accounts','Review']:[])];if(!pages.includes(page))page=pages[0];
let html='<h1>'+esc(page)+'</h1><p class="muted">'+esc(user.username)+' · '+esc(user.role)+'</p><nav>'+pages.map(p=>'<button class="'+(p===page?'':'secondary')+'" data-page="'+p+'">'+p+'</button>').join('')+'</nav>';
const ben=(data.beneficiaries||[]).filter(b=>b.active),bl=opts(ben.map(b=>({...b,name:b.name+' · '+b.code})));
if(page==='Dashboard'){const ver=data.verification||[],prod=data.production||[];html+='<div class="grid">'+[['Active beneficiaries',ben.length],['Recent completed pieces',prod.reduce((s,p)=>s+Number(p.pieces_completed),0)],['Matched recent entries',ver.filter(x=>x.status==='matched').length],['Recent mismatches',ver.filter(x=>x.status==='mismatch').length]].map(x=>card(x[0],'<div class="kpi">'+x[1]+'</div>')).join('')+'</div>'+card('Recent production',table(prod,[['work_date','Date'],['vendor','Vendor'],['product','Product'],['pieces_completed','Completed']]))}
if(page==='Attendance'){html+=card('Daily attendance',form('attendance',studio()+field('work_date','Work date','date',today())+'<button type="button" class="secondary" id="markall">Mark listed beneficiaries present</button><div id="attendance">'+ben.map(b=>'<div data-studio="'+esc(b.studio_id)+'"><label>'+esc(b.name)+' · '+esc(b.code)+'</label><select data-attendance="'+esc(b.id)+'"><option value="">Unmarked</option>'+['present','absent','half_day','leave','home_based'].map(s=>'<option>'+s+'</option>').join('')+'</select></div>').join('')+'</div>'))}
if(page==='Production'){html+=card('Daily production',form('production',studio()+field('work_date','Work date','date',today())+select('vendor_id','Vendor',opts(data.vendors))+select('product_id','Product',opts(data.products))+'<div class="grid">'+field('provided','Pieces provided','number')+field('completed','Pieces completed','number')+field('rate','Vendor rate per piece (₹)','number')+'</div><h3>Beneficiary allocations</h3><div id="allocations"></div><button type="button" class="secondary" id="addalloc">Add beneficiary</button>'))}
if(page==='Verification'){html+=card('Independent income cross-check',table(data.verification,[['work_date','Date'],['name','Beneficiary'],['manager_income','Manager ₹'],['beneficiary_income','Self ₹'],['status','Status'],['verified_income','Matched ₹']]))}
if(page==='My income'){html+=card('My income history',table(data.self,[['work_date','Date'],['income','Diva income ₹'],['outside_income','Other income ₹']]))}
if(page==='Submit income'){html+=card('આજની આવક · Daily income',form('self_income',field('work_date','તારીખ / Date','date',today())+field('income','Diva income (₹)','number')+'<label>Outside income (optional)</label><input name="outside_income" type="number" min="0" step=".01">'))}
if(page==='Expenses')html+=card('Record expense',form('expense',studio()+field('work_date','Date','date',today())+field('category','Category')+field('amount','Amount ₹','number')+'<label>Notes</label><input name="notes">'));
if(page==='Payments')html+=card('Record beneficiary payment',form('payment',studio()+select('beneficiary_id','Beneficiary',bl)+field('work_date','Date','date',today())+field('amount','Amount ₹','number')+'<label>Reference</label><input name="reference">'));
if(page==='Master data'){html+=card('Register beneficiary',form('master','<input type="hidden" name="kind" value="beneficiary">'+studio()+field('code','Unique code')+field('name','Registered name')+'<label>Batch</label><input name="batch"><label>Partner</label><input name="partner">'+select('category','Category','<option>regular</option><option>alumni</option>')))+card('Beneficiary master',table(data.beneficiaries,[['code','Code'],['name','Name'],['batch','Batch'],['category','Category']]))+['vendor','product','studio'].map(k=>card('Add '+k,form('master','<input type="hidden" name="kind" value="'+k+'">'+field('name','Name')))).join('');}
if(page==='Accounts')html+=card('Create account',form('create_user',studio()+select('role','Role','<option>manager</option><option>beneficiary</option>'+(user.role==='owner'?'<option>admin</option>':''))+field('username','Username')+field('password','Temporary password','password')+'<label>Beneficiary (if applicable)</label><select name="beneficiary_id"><option value="">Not applicable</option>'+bl+'</select>'));
if(page==='Review')html+=card('Record admin income review',form('review',studio()+select('beneficiary_id','Beneficiary',bl)+field('work_date','Date','date',today())+field('amount','Approved income ₹','number')+field('reason','Reason')));
root.innerHTML=html;root.querySelectorAll('input[type=number]').forEach(x=>{x.min='0';x.step=['provided','completed'].includes(x.name)?'1':'.01'});const add=()=>{document.querySelector('#allocations').insertAdjacentHTML('beforeend','<div class="alloc"><select class="bid"><option value="">Beneficiary</option>'+bl+'</select><input class="qty" type="number" min="0" step="1" placeholder="Pieces"><input class="rate" type="number" min="0" step=".01" placeholder="₹ / piece"></div>')};if(document.querySelector('#addalloc')){document.querySelector('#addalloc').onclick=add;add()}const all=document.querySelector('#markall');if(all)all.onclick=()=>root.querySelectorAll('[data-attendance]').forEach(x=>{if(!x.closest('[hidden]'))x.value='present'});const st=root.querySelector('select[name=studio_id]');if(st&&page==='Attendance'){const filter=()=>root.querySelectorAll('[data-studio]').forEach(x=>{x.hidden=x.dataset.studio!==st.value});st.onchange=filter;filter()}
}
root.addEventListener('click',e=>{if(e.target.dataset.page){page=e.target.dataset.page;msg.textContent='';render()}});
root.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,a=f.dataset.action,b=Object.fromEntries(new FormData(f));msg.textContent='';const btn=f.querySelector('button:last-child');if(btn)btn.disabled=true;try{if(a==='attendance')b.entries=[...f.querySelectorAll('[data-attendance]')].filter(x=>x.value&&!x.closest('[hidden]')).map(x=>({beneficiary_id:x.dataset.attendance,status:x.value}));if(a==='production')b.allocations=[...f.querySelectorAll('.alloc')].filter(x=>x.querySelector('.bid').value).map(x=>({beneficiary_id:x.querySelector('.bid').value,pieces:x.querySelector('.qty').value,rate:x.querySelector('.rate').value}));const r=await api(a,b);if(a==='login'){user=r.user;user.must_change_password?render():await load()}else if(a==='change_password'){showLogin();msg.textContent='Password changed. Sign in again.'}else{await load();msg.textContent='Saved successfully.'}}catch(err){msg.textContent=err.message}finally{if(btn)btn.disabled=false}});
logout.onclick=async()=>{try{await api('logout')}finally{showLogin()}};
(async()=>{try{user=(await api('me')).user;user.must_change_password?render():await load()}catch{showLogin();try{const r=await fetch('/api?health=1');const h=await r.json();if(h.database!=='connected')msg.textContent='Database setup is pending. This preview is not ready for real data.'}catch{msg.textContent='Backend unavailable.'}}})();
</script></body></html>
