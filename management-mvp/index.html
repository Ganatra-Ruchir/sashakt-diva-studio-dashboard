const root=document.querySelector('#root'),msg=document.querySelector('#message'),logout=document.querySelector('#logout');
let user=null,data={},page='Dashboard',reportState=null,reportSequence=0,managerMonth='',managerBatch='',managerSeq=0,attendanceDate='',attendanceBatch='',attendanceStudio='',incomeDate='',adminMonth='',adminStudio='',adminBatch='',adminDemo=false,adminSeq=0;

function bindAdminDashboard(){
const el=id=>root.querySelector('#'+id),month=el('adminMonth'),studio=el('adminStudio'),batch=el('adminBatch'),demo=el('adminDemo'),out=el('adminMetrics');
const syncBatch=()=>{const studioName=(data.studios||[]).find(s=>String(s.id)===studio.value)?.name;const list=[...new Map([...(data.beneficiaries||[]).filter(b=>(!studio.value||String(b.studio_id)===studio.value)&&String(b.code).startsWith('DEMO-')===(demo.value==='demo')).map(b=>b.batch||'Unassigned'),...(demo.value==='actual'?(data.archive_batches||[]).filter(b=>!studio.value||b.studio===studioName).map(b=>b.batch):[])].map(x=>[String(x).toLowerCase().replace(/[^a-z0-9]/g,''),x])).values()].sort();batch.innerHTML='<option value="">All batches</option>'+list.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(list.includes(adminBatch))batch.value=adminBatch;else adminBatch='';};
const rupee=v=>v==null?'—':'₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmt=v=>Number(v).toLocaleString('en-IN');const sum=(rows,k)=>rows.reduce((s,r)=>s+Number(r[k]||0),0);
const money=(rows,k)=>rows.some(r=>r[k]!=null)?rupee(sum(rows,k)):'—';
const run=async()=>{const seq=++adminSeq;adminMonth=month.value;adminStudio=studio.value;adminBatch=batch.value;adminDemo=demo.value==='demo';out.innerHTML='<div class="card empty">Loading overview…</div>';try{const r=await api('operational_dashboard',{month:adminMonth+'-01',studio_id:adminStudio,batch:adminBatch,demo:adminDemo});if(seq!==adminSeq||!out.isConnected)return;const p=r.people||[],active=p.filter(x=>x.active),earning=active.filter(x=>Number(x.earned)>0),recorded=p.filter(x=>x.earned!=null),targets=active.filter(x=>Number(x.target)>0&&x.earned!=null),low=targets.filter(x=>Number(x.earned)<Number(x.target)),avg=recorded.length?sum(recorded,'earned')/recorded.length:null,matched=sum(p,'matched'),differences=sum(p,'differences'),awaiting=sum(p,'awaiting');
const metrics=[
['Active beneficiaries',fmt(active.length),fmt(active.filter(x=>x.category==='regular').length)+' regular · '+fmt(active.filter(x=>x.category==='alumni').length)+' alumni'],
['Beneficiaries earning',earning.length+' / '+active.length,targets.length?low.length+' below target · '+targets.length+' with recorded income and target':'Active roster · positive monthly earnings'],
['Production earnings',money(p,'earned'),avg==null?'No income records':'Average '+rupee(avg)+' per beneficiary with records'],
['Verified earnings',money(p,'verified'),fmt(matched)+' matched / approved beneficiary-days'],
['Income checks pending',fmt(differences+awaiting),fmt(differences)+' differences · '+fmt(awaiting)+' awaiting submission'],
['Pending work',fmt(sum(p,'tasks')),fmt(sum(p,'remaining'))+' pieces · '+rupee(sum(p,'expected'))+' expected'],
['Accepted pieces',fmt(sum(p,'accepted')),fmt(sum(p,'rejected'))+' rejected in selected month'],
['Payments made',money(p,'paid'),'Actual cash paid in selected month'],
['Attendance records',fmt(sum(p,'marked')),fmt(sum(p,'present'))+' present marks in selected month']
];
const groups=new Map();for(const x of p){if(!groups.has(x.studio))groups.set(x.studio,[]);groups.get(x.studio).push(x)}
const studioRows=[...groups].map(([name,rows])=>({studio:name,active:rows.filter(x=>x.active).length,earning:rows.filter(x=>x.active&&Number(x.earned)>0).length,earned:money(rows,'earned'),verified:money(rows,'verified'),pending:sum(rows,'remaining'),checks:sum(rows,'differences')+sum(rows,'awaiting')}));

const archivePanel=adminDemo?'':card('Historical income archive', '<p class="help">'+(selectedArchive.length?'Archive for selected month.':'No archive for selected month; latest available per studio is shown where available.')+' Historical source-matched amounts are not live verified earnings.</p>'+table(archive,[['studio','Studio'],['source_batch','Batch'],['month_start','Month'],['coverage','Coverage'],['source_rows','Source rows'],['matched','Source-matched ₹'],['flagged','Flagged ₹']]));

}catch(e){if(seq===adminSeq&&out.isConnected)out.innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}};
